name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  npm-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: ${{ github.event.repository.name }}-frontend/package-lock.json
      - uses: javidahmed64592/actions-template-python/actions/ci/npm-code-check@main

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: ${{ github.event.repository.name }}-frontend/package-lock.json
      - uses: javidahmed64592/actions-template-python/actions/ci/npm-tests@main
