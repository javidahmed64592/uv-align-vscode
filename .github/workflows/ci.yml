name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  npm-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: |
          npm run type-check
          echo "✅ Type checking passed"

      - name: Run linting
        run: |
          npm run lint
          echo "✅ Linting passed"

      - name: Run formatting check
        run: |
          npm run format
          echo "✅ Formatting check passed"

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run test
          echo "✅ Tests passed"
